name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Sanity check project format
        run: |
          echo "objectVersion:"
          grep -m1 objectVersion SandboxTOCTOU.xcodeproj/project.pbxproj

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project SandboxTOCTOU.xcodeproj \
            -scheme SandboxTOCTOU \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SandboxTOCTOU.app"
          test -d "$APP"
          rm -rf Payload SandboxTOCTOU.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --remove-signature Payload/SandboxTOCTOU.app 2>/dev/null || true
          zip -qry SandboxTOCTOU.ipa Payload
          echo "IPA size: $(du -h SandboxTOCTOU.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxTOCTOU-ipa
          path: SandboxTOCTOU.ipa
          if-no-files-found: error
          retention-days: 30