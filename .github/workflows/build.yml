name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          xcodebuild \
            -project SandboxTOCTOU.xcodeproj \
            -scheme SandboxTOCTOU \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/SandboxTOCTOU.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --remove-signature Payload/SandboxTOCTOU.app 2>/dev/null || true
          zip -qry SandboxTOCTOU.ipa Payload
          du -h SandboxTOCTOU.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SandboxTOCTOU-ipa
          path: SandboxTOCTOU.ipa
          retention-days: 30
