name: SandboxTOCTOU
options:
  bundleIdPrefix: com.poc
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  SandboxTOCTOU:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poc.sandboxtoctou
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: "NO"